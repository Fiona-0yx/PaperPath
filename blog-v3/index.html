<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0"
    />
    <title>论径 · 循径而读，渐入佳境。</title>
    <link rel="icon" type="image/svg+xml" href="./lun-path/favicon.svg" />
    <meta name="description" content="沿藤蔓探索学习方向，建立学习画像，找到适合自己的论文。" />
    <style>
      .load {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 80px;
        height: 80px;
      }
      .load hr {
        border: 0;
        margin: 0;
        width: 40%;
        height: 40%;
        position: absolute;
        border-radius: 50%;
        animation: spin 2s ease infinite;
      }

      .load :first-child {
        background: #49b1f5;
        animation-delay: -1.5s;
      }
      .load :nth-child(2) {
        background: #aadafa;
        animation-delay: -1s;
      }
      .load :nth-child(3) {
        background: #49b1f5;
        animation-delay: -0.5s;
      }
      .load :last-child {
        background: #aadafa;
      }

      @keyframes spin {
        0%,
        100% {
          transform: translate(0);
        }
        25% {
          transform: translate(160%);
        }
        50% {
          transform: translate(160%, 160%);
        }
        75% {
          transform: translate(0, 160%);
        }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <noscript>
        <strong>请启用 JavaScript 以使用论径。</strong>
      </noscript>
      <div class="load">
        <hr />
        <hr />
        <hr />
        <hr />
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
